```
<div class="container">

    <div class="logo">
        ♻️
    </div>

    <h1>
        Smart Waste Classifier
    </h1>

    <p class="subtitle">
        Upload a waste image and let AI identify its category
    </p>


    <div class="upload-section">

        <div class="upload-icon">
            📸
        </div>

        <p class="upload-text">
            Select an image for AI analysis
        </p>

        <label
            for="imageInput"
            class="upload-button"
        >
            Choose Image
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

    </div>


    <div id="preview-container">

        <img
            id="preview"
            alt="Waste Image Preview"
        >

        <br>

        <button
            class="predict-button"
            id="predictButton"
        >
            🤖 Analyze Waste
        </button>

    </div>


    <div id="result"></div>


    <div class="footer">
        Powered by MobileNetV2 & FastAPI
    </div>

</div>



<script>

    const imageInput =
        document.getElementById("imageInput");

    const preview =
        document.getElementById("preview");

    const previewContainer =
        document.getElementById(
            "preview-container"
        );

    const result =
        document.getElementById("result");

    const predictButton =
        document.getElementById(
            "predictButton"
        );


    imageInput.addEventListener(
        "change",
        function () {

            const file =
                imageInput.files[0];


            if (!file) {

                previewContainer.style.display =
                    "none";

                return;

            }


            preview.src =
                URL.createObjectURL(file);


            previewContainer.style.display =
                "block";


            result.innerHTML = "";

        }
    );


    predictButton.addEventListener(
        "click",
        predictWaste
    );


    async function predictWaste() {

        const file =
            imageInput.files[0];


        if (!file) {

            result.innerHTML = `
                <div class="error">
                    Please select an image first.
                </div>
            `;

            return;

        }


        result.innerHTML = `
            <div class="loading">
                🤖 AI is analyzing your waste image...
            </div>
        `;


        predictButton.disabled = true;

        predictButton.innerHTML =
            "⏳ Analyzing...";


        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        try {

            const response =
                await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Prediction failed"
                );

            }


            result.innerHTML = `

                <div class="result-card">

                    <div class="result-title">
                        🤖 AI Prediction Result
                    </div>


                    <div class="waste-name">
                        ${data.predicted_class}
                    </div>


                    <div class="confidence-box">

                        <div class="confidence-label">
                            AI Confidence
                        </div>


                        <div class="confidence-number">
                            ${data.confidence}%
                        </div>


                        <div class="progress-container">

                            <div
                                class="progress-bar"
                                style="
                                    width:
                                    ${data.confidence}%
                                "
                            >
                            </div>

                        </div>

                    </div>

                </div>

            `;


        }

        catch (error) {

            console.error(error);

            result.innerHTML = `

                <div class="error">

                    ❌ ${error.message}

                    <br><br>

                    Make sure the FastAPI
                    server is running.

                </div>

            `;

        }


        finally {

            predictButton.disabled = false;

            predictButton.innerHTML =
                "🤖 Analyze Waste";

        }

    }

</script>
